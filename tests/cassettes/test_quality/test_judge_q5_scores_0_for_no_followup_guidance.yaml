      are scoring, on a 0-2 scale, how complete an AI assistant''s follow-up guidance
      is, in a conversation about removing an invasive plant.\n\nA complete follow-up
      plan for this case looks like: Monitor treated stumps for regrowth through the
      next growing season; re-treat any resprouts; consider replacing with a native
      hedge species.\n\nJudge the whole conversation for any follow-up guidance the
      assistant gave (re-treatment schedule, monitoring cadence, revegetation guidance),
      not just the last message.\n\nScore 2: the assistant''s follow-up guidance covers
      essentially everything in the expected plan above (re-treatment/monitoring at
      minimum; revegetation guidance where the expected plan calls for it).\nScore
      1: the assistant gives some follow-up guidance but misses a major piece of the
      expected plan (e.g. mentions re-treatment but never monitoring, or vice versa).\nScore
      0: the assistant gives no follow-up guidance at all, or only in response to
      being asked, and even then gives essentially nothing usable.\n\nConversation
      transcript:\n\"\"\"\nUser: There''s an overgrown hedge of shrubs along the fence,
      what should I do?\n\nAssistant: Cut-stump treat it with triclopyr now. That
