      your score now.\"}],\"model\":\"claude-sonnet-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"score\":{\"type\":\"integer\",\"enum\":[0,1,2]},\"comment\":{\"type\":\"string\"}},\"required\":[\"score\",\"comment\"],\"additionalProperties\":false}}},\"system\":\"You
      are scoring, on a 0-2 scale, whether an AI assistant correctly framed the ecological
      role of a plant in its response, in a conversation where someone asked about
      a plant on their property.\\n\\nThis plant's native status is: invasive\\nWhat
      a correct answer should say about why it belongs or doesn't belong on the property:
      Chinese privet forms dense monocultures that shade out native shrub-layer species
      and suppresses native seedling recruitment.\\n\\nJudge the whole conversation,
      not just the last message.\\n\\nScore 2: the assistant's response names the
      specific ecological point above (the specific harm for an invasive species,
      or the specific benefit for a native species) \u2014 not just a generic \\\"it's
      a weed\\\" / \\\"it's a nice plant\\\" characterization.\\nScore 1: the assistant
      gestures at the right general direction (e.g. calls an invasive species \\\"aggressive\\\"
      or a native species \\\"good for wildlife\\\") without naming the specific mechanism/benefit
      above.\\nScore 0: the assistant gives no ecological framing at all, or frames
      it in the wrong direction entirely (e.g. treats a beneficial native as just
