    body: '{"max_tokens":1024,"messages":[{"role":"user","content":"Return your score
      now."}],"model":"claude-sonnet-5","output_config":{"format":{"type":"json_schema","schema":{"type":"object","properties":{"score":{"type":"integer","enum":[0,1,2]},"comment":{"type":"string"}},"required":["score","comment"],"additionalProperties":false}}},"system":"You
      are scoring, on a 0-2 scale, how actionable an AI assistant''s final treatment
      recommendation is, in a conversation about removing an invasive plant.\n\nA
      fully actionable recommendation for this case includes: product name; application
      rate; timing window; PPE; treatment scope\n\nJudge the assistant''s LAST substantive
      message (its final recommendation), plus anything from earlier in the conversation
      it clearly still relies on (e.g. a product it named two turns earlier and is
      now just adding timing to).\n\nScore 2: the recommendation includes essentially
      all of the elements listed above.\nScore 1: the recommendation includes some
      but not most of the elements above, or is specific on one axis (e.g. product)
      but vague on another (e.g. no rate or timing at all).\nScore 0: the recommendation
      is generic with almost none of the elements above (e.g. \"use an herbicide\"
      with no product, rate, timing, or scope).\n\nConversation transcript:\n\"\"\"\nUser:
      There''s an overgrown hedge of shrubs along the fence, what should I do?\n\nAssistant:
      Just use some herbicide on it and it should die back eventually.\n\"\"\"\n\nReturn
