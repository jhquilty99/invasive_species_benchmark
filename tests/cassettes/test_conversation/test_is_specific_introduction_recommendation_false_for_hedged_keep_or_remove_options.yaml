    body: "{\"max_tokens\":256,\"messages\":[{\"role\":\"user\",\"content\":\"Assistant's
      latest message:\\n\\\"\\\"\\\"\\nYou could keep it if you like the look, or
      you could remove it and plant something else if you'd rather have more sun in
      that corner \u2014 really depends on what you want out of that spot.\\n\\\"\\\"\\\"\\n\\nDoes
      this message contain a single, specific, committed keep/remove recommendation
      per the rule above?\"}],\"model\":\"claude-haiku-4-5-20251001\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"is_specific_recommendation\":{\"type\":\"boolean\"}},\"required\":[\"is_specific_recommendation\"],\"additionalProperties\":false}}},\"system\":\"You
      classify whether an assistant's latest message, in a conversation where someone
      is asking whether to plant or keep a plant on their property, contains a single,
      specific, committed recommendation on whether to plant/keep it or remove/avoid
      it.\\n\\nClassify true only if the message commits to ONE clear recommendation
      the person could act on right now \u2014 'keep/plant it' or 'remove it' (or
      'replace it with X'), stated as this message's actual position, not just one
      option among several. A message that clearly commits to one position while also
      mentioning a caveat or a discarded alternative still counts as true \u2014 the
      bar is whether a single position has been committed to, not whether anything
      else is mentioned.\\n\\nClassify false for any of the following, even if the
      message is long or substantive:\\n- An unranked list of options ('you could
      keep it, or you could remove it and plant something else') with no single position
      committed to.\\n- A recommendation that branches on a fact the person hasn't
      actually stated (e.g. 'if you want low-maintenance, remove it; if you don't
      mind the upkeep, keep it') \u2014 no single position has been committed to for
      this person's real, still-unknown situation.\\n- A request for more information
      before recommending anything.\\n- Generic, non-committal advice with no clear
      keep-or-remove position (e.g. 'it depends on your preferences' or 'consider
      consulting a nursery' alone).\\n- An outright refusal or decision not to give
      a recommendation.\\n\\nJudge only the assistant's latest message. Use the rest
      of the conversation only as context for what that message means, not as a substitute
      for what the latest message itself commits to.\"}"
