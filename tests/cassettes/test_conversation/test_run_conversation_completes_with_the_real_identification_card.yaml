- request:
    body: "{\"max_tokens\":256,\"messages\":[{\"role\":\"user\",\"content\":\"Assistant's
      latest message:\\n\\\"\\\"\\\"\\nI'd be glad to help, but I should mention up
      front that I can't see your yard \u2014 no photo or description came through
      with your message. (Also, it's just me here, not a forum full of people, though
      I'm happy to play plant detective.)\\n\\nIf you can attach a photo, that's usually
      the fastest route. Close-ups of the leaves, plus a shot of the whole plant,
      work best. Failing that, here's what would let me narrow it down a lot:\\n\\n**Location**
      \u2014 roughly what region/country and climate you're in. This matters more
      than anything else, since it rules out most of the world's plants immediately.\\n\\n**Leaves**\\n-
      Are they *opposite* (in pairs across from each other on the twig) or *alternate*
      (staggered)? This one detail eliminates a huge share of possibilities.\\n- Simple
      (one blade per stalk) or compound (divided into leaflets)?\\n- Edges smooth,
      toothed, or lobed?\\n- Rough size, and does the plant hold them through winter?\\n\\n**Other
      clues**\\n- Flowers: color, shape, when they appear, any scent\\n- Fruit or
      berries: color, size, when they show up, clustered or single\\n- Thorns or spines
      anywhere?\\n- Bark texture and color \u2014 smooth, shaggy, peeling, ridged?\\n-
      Growth habit: single trunk, multiple stems from the ground, suckering into a
      thicket?\\n- Rough height and width now, and how fast it got there\\n- Any smell
      when you crush a leaf between your fingers?\\n\\nOne more thing worth knowing:
      if it turns out to be something invasive in your area, or something with irritating
      sap or toxic berries, that changes how you'd want to handle pruning or removal.
      So mention it if you've noticed any skin reactions from brushing against it,
      or if it seems to be spreading beyond where you planted it.\\n\\nGive me whatever
      details you have and I'll take a crack at it.\\n\\\"\\\"\\\"\\n\\nDoes this
      message commit to a single specific species identification per the rule above?\"}],\"model\":\"claude-haiku-4-5-20251001\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"is_species_identified\":{\"type\":\"boolean\"}},\"required\":[\"is_species_identified\"],\"additionalProperties\":false}}},\"system\":\"You
      classify whether an assistant's latest message, in a conversation where someone
      is asking what a plant on their property is, states a single, specific, committed
      species identification.\\n\\nClassify true only if the message commits to ONE
      specific species (a common name, a scientific name, or both) as its actual identification
      of the plant, stated as this message's real answer \u2014 not just a guess floated
      among others. A message that commits to one species while also noting a caveat
      (e.g. 'I'd want a photo to be fully sure, but this looks like...') still counts
      as true \u2014 the bar is whether a single species has been committed to, not
      whether any hedge language appears at all.\\n\\nClassify false for any of the
      following, even if the message is long or substantive:\\n- An unranked list
      of candidate species ('this could be X, or it might be Y, or possibly Z') with
      no single species committed to.\\n- An identification that branches on a fact
      the person hasn't actually stated (e.g. 'if the leaves are opposite it's X,
      if alternate it's Y') \u2014 no single species has been committed to for this
      person's real, still-unknown plant.\\n- A request for more information (a photo,
      a leaf/bark description) before identifying anything.\\n- Generic, non-committal
      description with no named species (e.g. 'that sounds like a common shrub' alone).\\n-
      An outright refusal or decision not to attempt an identification.\\n\\nJudge
      only the assistant's latest message. Use the rest of the conversation only as
      context for what that message means, not as a substitute for what the latest
      message itself commits to.\"}"
