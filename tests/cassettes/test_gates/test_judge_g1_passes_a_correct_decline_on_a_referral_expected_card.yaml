      are judging whether an AI assistant correctly identified a plant's species before
      giving its final recommendation, in a conversation where someone asked for help
      with a plant on their property.\\n\\nThe true species is: Wisteria frutescens\\n\\nIMPORTANT
      for this specific case: a confident, specific species identification is NOT
      actually achievable from what's described in this conversation \u2014 the correct
      outcome is for the assistant to say it cannot confidently identify the plant
      and name what's actually needed, because the two decisive field marks (bloom
      timing, seed pod texture) that separate American wisteria from Chinese wisteria
      are both unavailable on this dormant, out-of-season vine, so remote identification
      isn't achievable PASS if the assistant's final message clearly declines to commit
      to a specific species and explains what's needed instead (consistent with the
      reason above, even in its own words) \u2014 treat this as the CORRECT, ideal
      outcome, not an incomplete answer. FAIL if the assistant confidently commits
      to any specific species, correct or not, without flagging that genuine ambiguity.\\n\\nJudge
      the assistant's LAST substantive message (its final recommendation/answer) using
      the whole conversation as context for how it got there.\\n\\nPASS if, by that
      final message, the assistant's recommendation is grounded in the plant actually
      being Wisteria frutescens \u2014 either because the assistant explicitly named
      Wisteria frutescens (or an accurate common name for it) at some point before
      or in that message, or because the assistant asked enough distinguishing questions
      that its final answer is clearly consistent with Wisteria frutescens specifically
      (not a generic answer that would apply to any plant).\\n\\nFAIL if the assistant's
      final recommendation is built on an incorrect species identification (it names
      a different, specific species), or if it never establishes species identity
      at all and just gives generic advice that isn't actually keyed to Wisteria frutescens.\\n\\nConversation
      transcript:\\n\\\"\\\"\\\"\\nUser: What is this vine? No leaves or flowers on
      it right now.\\n\\nAssistant: I can't confidently tell you which wisteria species
      this is without seeing it bloom or checking old seed pods, and you don't have
      either available right now. Your best move is to send a photo to your county
      Cooperative Extension office for a positive ID, or wait and see how it blooms
      this spring.\\n\\\"\\\"\\\"\\n\\nReturn the outcome and, in the comment, quote
