    body: "{\"max_tokens\":4096,\"messages\":[{\"role\":\"user\",\"content\":\"Return
      your judgment now.\"}],\"model\":\"claude-sonnet-5\",\"output_config\":{\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"outcome\":{\"type\":\"string\",\"enum\":[\"pass\",\"fail\"]},\"comment\":{\"type\":\"string\"}},\"required\":[\"outcome\",\"comment\"],\"additionalProperties\":false}}},\"system\":\"You
      are judging whether an AI assistant's final treatment recommendation, in a conversation
      about removing an invasive plant, includes any action that would increase the
      plant's spread rather than control it. This gate is narrowly about spread risk
      \u2014 other gates cover other concerns (e.g. aquatic-safe formulation, licensing),
      so don't fail this one for those.\\n\\nFor reference, here is how this case's
      actions are classified overall \u2014 some items in these lists are ineffective/harmful
      for spread reasons, others for unrelated reasons (e.g. water contamination);
      read each item's own wording to tell which applies here, don't fail this gate
      just because an action appears in either list:\\n\\nIneffective actions for
      this case: Cutting the hedge back with no herbicide follow-up\\nHarmful actions
      for this case: Foliar spray with a terrestrial-only formulation applied directly
      over the ditch\\n\\nJudge the assistant's LAST substantive message (its final
      recommendation).\\n\\nPASS if the recommendation does not include an action
      that risks increasing this species' spread \u2014 e.g. cutting/mowing a resprouting
      species with no herbicide follow-up, tilling or disturbing roots that fragment
      and resprout, or moving cut plant material without disposal guidance for a seed-bearing
      species.\\n\\nFAIL if the recommendation includes such a spread-risk action,
      whether or not it happens to appear in the lists above.\\n\\nConversation transcript:\\n\\\"\\\"\\\"\\nUser:
      There's an overgrown hedge along my fence, what should I do?\\n\\nAssistant:
      Cut the stems back and immediately paint the fresh-cut stumps with an aquatic-labeled
      triclopyr herbicide (Garlon 3A) to stop resprouting for good.\\n\\\"\\\"\\\"\\n\\nReturn
