species: "Ailanthus altissima"
common_name: "Tree of heaven"
failure_archetype: "Cutting triggers root suckering — intervention makes it worse"
jurisdiction: "NC / southeastern coastal plain"

cells:
  - category: method_selection
    answer: >
      Clemson Cooperative Extension's control procedures differ by tree size. For large trees:
      "Make stem injections and then apply Garlon 3A, Pathway*, Pathfinder II, or Arsenal AC* in
      dilutions and cut spacings specified on the herbicide label (midsummer best, late winter
      somewhat less effective). For felled trees, apply these herbicides to stem and stump tops
      immediately after cutting." For saplings: "Apply Garlon 4 as a 20-percent solution in basal
      oil, vegetable oil, crop oil concentrate, diesel fuel, or kerosene (2.5 quarts per 3-gallon
      mix) or apply undiluted Pathfinder II to young bark as a basal spray." For seedlings and
      saplings: "Thoroughly wet all leaves with one of the following herbicides in water with a
      surfactant (July to October): Arsenal AC* as a 1-percent solution (4 ounces per 3-gallon
      mix), Krenite S as a 15-percent solution (3 pints per 3-gallon mix), Garlon 4 as a 2-percent
      solution (8 ounces per 3-gallon mix), or Escort XP* at 1 ounce per acre." The label flags the
      starred products: "*Nontarget plants may be killed by root uptake." NC State Extension notes
      hand-pulling is an option only at the earliest stage — "Seedlings can be removed manually if
      the entire root system is removed" — beyond that, cutting alone does not work (see
      resprout/regrowth). For cut-stump work specifically, NCDOT's own removal-plan report adds a
      timing detail Clemson doesn't: treat "from mid-summer to early fall to maximize translocation to
      roots," and expect that "treatments will likely require a follow-up in subsequent years to ensure
      control of root suckers and any resprouts."
    citation:
      source: >
        Clemson Cooperative Extension, Forestry & Wildlife Blog — Invasive Species Spotlight:
        Tree-of-Heaven (Ailanthus altissima), for the herbicide rates; hand-pulling claim per NC State
        Extension Publications — Tree-of-heaven (Ailanthus), https://content.ces.ncsu.edu/tree-of-heaven-ailanthus
        (2022-07-29); cut-stump timing and multi-year follow-up need per NC Department of
        Transportation — High-Threat Invasive Plant Species and Removal Plan Report (April 21, 2026),
        https://webservices.ncleg.gov/ViewDocSiteFile/118844
      url: "https://blogs.clemson.edu/fnr/invasive-species-spotlight-tree-of-heaven-ailanthus-altissima/"
      publication_date: "2021-10-12"
    jurisdiction_range:
      flagged: false
      note: null
  - category: resprout_regrowth
    answer: >
      Tree-of-heaven "can sprout vigorously from its roots," and NC State Extension is explicit
      that "Simply cutting down tree-of-heaven will not kill this tree because it will resprout."
      The fix is stated directly in the same sentence: "If a tree is removed, the stump must be
      treated with an herbicide (e.g. triclopyr) to prevent this." This is the core trap the
      species is chosen to probe — a landowner who cuts the tree and stops there has not removed
      it, and may end up with a wider thicket of root suckers around the original trunk than the
      single tree they started with.
    citation:
      source: "NC State Extension Publications — Tree-of-heaven (Ailanthus)"
      url: "https://content.ces.ncsu.edu/tree-of-heaven-ailanthus"
      publication_date: "2022-07-29"
    jurisdiction_range:
      flagged: false
      note: null
  - category: timing_windows
    answer: >
      For seedlings and saplings, foliar spray should "thoroughly wet all leaves with one of the
      following herbicides in water with a surfactant (July to October)." For stem injection
      (hack-and-squirt) on larger trees, Clemson's control procedures specify "midsummer best,
      late winter somewhat less effective." There is no safe season for cutting alone without a
      paired herbicide application, since an untreated cut stump resprouts regardless of the time
      of year it's cut — the timing question here only governs when the herbicide itself is
      applied to the stump, cut face, or foliage, not when mechanical cutting happens. Because
      glyphosate-type products "will kill almost all plants contacted," foliar spray should only be
      applied "when air is calm to prevent drift" — a terrestrial glyphosate label's own drift warning
      is explicit that contact with "foliage, green stems, exposed non-woody roots or fruit of crops,
      desirable plants and trees" risks "severe plant injury or destruction."
    citation:
      source: >
        Clemson Cooperative Extension, Forestry & Wildlife Blog — Invasive Species Spotlight:
        Tree-of-Heaven (Ailanthus altissima), for the herbicide rates and timing; drift-warning quotes
        per Ragan and Massey, LLC — Compare-N-Save Concentrate Weed & Grass Killer 41% Glyphosate
        product label (EPA Reg. No. 84009-27) and Greenbook (Bayer CropScience) — AquaMaster Herbicide
        Complete Directions for Use label (EPA Reg. No. 524-343)
      url: "https://blogs.clemson.edu/fnr/invasive-species-spotlight-tree-of-heaven-ailanthus-altissima/"
      publication_date: "2021-10-12"
    jurisdiction_range:
      flagged: false
      note: null
  - category: herbicide_legality
    answer: >
      Garlon 3A's label identifies its active ingredient as "Triclopyr: 2-[(3,5,6-trichloro-2-pyridinyl)oxy]
      acetic acid, triethylamine salt ... 44.4%" (EPA Reg. No. 62719-37), and carries no Restricted
      Use Pesticide classification — a North Carolina landowner without a pesticide applicator
      license may legally buy and apply it. For cut-stump work, the label directs: "Spray or paint
      the cut surfaces of freshly cut stumps and stubs with undiluted Garlon 3A. The cambium area
      next to the bark is the most vital area to wet." For hack-and-squirt: "Make cuts at a
      convenient height around the tree trunk with a hatchet or similar equipment so that the cuts
      overlap slightly and make a continuous circle around the trunk. Spray 1/2 milliliter of
      undiluted Garlon 3A or 1 milliliter of the diluted solution into each cut." The label also
      sets a restricted-entry interval: "Do not enter or allow worker entry into treated areas
      during the restricted entry interval (REI) of 48 hours." For a smaller DIY job, the
      ferti-lome Brush Killer•Stump Killer label (EPA Reg. No. 62719-226-7401) is an equivalent,
      "This Product Is For Outdoor Residential Use Only" homeowner-labeled alternative containing
      "Triclopyr (3,5,6-trichloro-2-Pyridinyloxyacetic acid), as the Triethylamine salt ... 8.8%,"
      instructing users to "apply the undiluted product with a paint brush or backpack sprayer to
      completely cover the freshly cut surface" to "kill stumps and prevent sprouting." A
      general-use glyphosate concentrate applied the same way to a fresh cut stump is an equally
      legal alternative active ingredient.
    citation:
      source: "US EPA Office of Pesticide Programs — GARLON 3A product label (EPA Reg. No. 62719-37)"
      url: "https://www3.epa.gov/pesticides/chem_search/ppls/062719-00037-20160225.pdf"
      publication_date: "2016-02-25"
    jurisdiction_range:
      flagged: false
      note: null
  - category: followup_secondary_invasion
    answer: >
      A single treatment does not finish the job, and there's a second, hidden front: the seed
      bank. In a two-year burial study, "Fifty percent of Ailanthus seeds survived the full length
      of the study (24 mo) after an initial phase of partial germination (51–79% of viable
      seeds)," and "After the first 5 mo no further decline in seed number was observed,
      suggesting persistence in the soil well beyond the 2-yr length of this study." The
      researchers' bottom line: "Complete eradication of a population will depend on elimination
      of the soil seed bank, which may require many years." They add a caution that cuts both
      ways for management: "Management should avoid creating canopy openings near existing
      populations with the goal of suppressing sexual reproduction and seedling establishment" —
      since open canopy favors new Ailanthus germination, removing a tree without addressing the
      resulting light gap can work against the goal of exhausting the seed bank. A landowner
      should plan to monitor the treated site for multiple growing seasons, not just re-check it
      once the following spring.
    citation:
      source: "Redwood, M.E., Matlack, G.R., & Huebner, C.D. — \"Seed longevity and dormancy state in an invasive tree species: Ailanthus altissima (Simaroubaceae)\" (USDA Forest Service Treesearch)"
      url: "https://research.fs.usda.gov/treesearch/58864"
      publication_date: "2019-01-01"
    jurisdiction_range:
      flagged: false
      note: null
  - category: disposal_nontarget_risk
    answer: >
      Tree-of-heaven's wood carries the same allelopathic compounds documented in the standing
      tree. A 2025 USDA Forest Service study found "soil under decomposing A. altissima wood is
      likely to negatively impact germination and growth of some newly seeded species for at
      least 18 mo," specifically finding "lower germination and biomass production for two of the
      native species" tested in soil taken directly beneath woodpiles — while soil sampled 2 m
      upslope or downslope from the same piles served as an unaffected control, so the measured
      effect was confined to soil in direct contact with the decomposing wood, not distant drift.
      The study's practical takeaway: "Removal of A. altissima coarse woody debris left behind
      after control efforts or disease may help ensure successful restoration of a site,
      especially if native seeding or planting is planned." If on-site disposal is unavoidable,
      aging the material helps: mulch "left outside for at least 2 yr (26 mo)" no longer showed
      the suppressive effect and "may be beneficial to native plants," so aged — not fresh —
      chipped material is the lower-risk choice, not a fresh brush pile. Separately, because
      herbicide is often applied by foliar spray or basal bark on standing trees near fence lines,
      drift onto neighboring desirable plants is also a real risk: the Garlon 3A label directs
      applicators to "not apply Garlon 3A directly to, or otherwise permit it to come into direct
      contact with, grapes, tobacco, vegetable crops, flowers, or other desirable broadleaf
      plants," and to "not permit spray mists containing Garlon 3A to drift onto such plants" —
      favor stem-injection or cut-stump treatment over foliar spray whenever the tree stands close
      to plants worth protecting, since the label's cut-surface method confines herbicide to "the
      cut surfaces of freshly cut stumps and stubs."
    citation:
      source: "Huebner, C.D. — \"Native perennials' germination and growth response to decomposing tree of heaven (Ailanthus altissima) stems\" (Invasive Plant Science and Management, USDA Forest Service Northern Research Station)"
      url: "https://www.cambridge.org/core/product/C04662CEC7461103A1D0E6261F69FD79/core-reader"
      publication_date: "2025-12-12"
    jurisdiction_range:
      flagged: false
      note: null
