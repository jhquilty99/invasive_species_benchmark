species: "Ligustrum sinense"
common_name: "Chinese privet"
failure_archetype: "Secondary invasion after removal — the \"now what\" gap"
jurisdiction: "NC / southeastern coastal plain"

cells:
  - category: method_selection
    answer: >
      Method depends on stem size. Seedlings under about 0.5 inch in diameter can be hand-pulled.
      Stems up to about 2 inches in diameter can be removed with a specialized weed-pulling tool. For
      larger plants, cutting or pulling alone is "not generally considered effective, and can even further
      the spread through the disturbing of the soil" that exposes bare ground privet colonizes readily —
      so larger plants need herbicide. Two herbicide options: a foliar spray of a 2% triclopyr solution
      (a selective herbicide that targets woody plants, so it's less likely to injure nearby grasses) with
      a 0.5% non-ionic surfactant, sprayed to thorough leaf coverage; or, for a cut plant, immediately
      applying a 50% triclopyr solution to the freshly cut stump within 6 inches of the ground, soaking
      the whole cut surface until it stops absorbing (roughly 3-5 minutes).
    citation:
      source: "NC Cooperative Extension, Madison County Center — On the Lookout for Non-Native Invasive Plant Species: Chinese Privet"
      url: "https://madison.ces.ncsu.edu/news/on-the-lookout-for-non-native-invasive-plant-species-chinese-privet/"
      publication_date: "2026-04-29"
    jurisdiction_range:
      flagged: false
      note: null
  - category: resprout_regrowth
    answer: >
      Chinese privet "colonizes by root sprouts," and cutting or pulling a larger plant without treating
      the cut stump with herbicide leaves that root system alive and able to resprout — which is also why
      cutting or pulling large plants is discouraged as a standalone method in the first place. Whichever
      method is used (foliar or cut-stump), the treated area needs to be checked throughout the year and
      again the following growing season for regrowth, since a colony that looks dead after one treatment
      can still push up new sprouts from surviving root tissue.
    citation:
      source: "NC Cooperative Extension, Madison County Center — On the Lookout for Non-Native Invasive Plant Species: Chinese Privet"
      url: "https://madison.ces.ncsu.edu/news/on-the-lookout-for-non-native-invasive-plant-species-chinese-privet/"
      publication_date: "2026-04-29"
    jurisdiction_range:
      flagged: false
      note: null
  - category: timing_windows
    answer: >
      Timing matters far more than herbicide rate for privet control. A controlled study of glyphosate and
      triclopyr foliar applications found spring (April) and fall (October-December) treatments gave 93-100%
      control with glyphosate and 49-70% with triclopyr, while summer (June/August) applications on the
      same species dropped to just 67-69% control with glyphosate and 14-26% with triclopyr — and varying
      the herbicide rate up or down across the tested range did not meaningfully change the outcome. This
      matches NC Cooperative Extension's foliar guidance of late fall through early spring, as long as
      daytime temperatures are regularly 65°F or warmer. Cut-stump treatment is far less season-restricted
      and can be done nearly year-round, with the one exception being frozen ground.
    citation:
      source: "Harrington, T.B. & Miller, J.H. — \"Effects of Application Rate, Timing, and Formulation of Glyphosate and Triclopyr on Control of Chinese Privet (Ligustrum sinense)\" (USDA Forest Service Treesearch)"
      url: "https://research.fs.usda.gov/treesearch/20695"
      publication_date: "2005-01-01"
    jurisdiction_range:
      flagged: false
      note: null
  - category: herbicide_legality
    answer: >
      Glyphosate is a federal general-use herbicide, not an EPA Restricted Use Pesticide, so a North
      Carolina landowner without a pesticide applicator license can legally buy and apply it themselves.
      Compare-N-Save Concentrate Weed & Grass Killer 41% Glyphosate (EPA Reg. No. 84009-27), sold over the
      counter, carries no Restricted Use Pesticide designation. For foliar treatment of privet, a roughly
      3% solution (about 12 oz of concentrate per 3 gallons of water) sprayed to thoroughly wet the leaves
      is a standard homeowner-scale rate; because glyphosate is non-selective, expect it to also kill any
      desirable grass or groundcover it contacts. Triclopyr is likewise general-use and non-restricted —
      ferti-lome Brush Killer • Stump Killer (8.8% triclopyr, triethylamine salt; EPA Reg. No.
      62719-226-7401) is an equivalent, explicitly homeowner-labeled ("For Outdoor Residential Use Only")
      product appropriate for the cut-stump method, since (unlike glyphosate) it targets woody plants
      selectively and is less likely to injure adjacent turf or herbaceous plants.
    citation:
      source: "Ragan and Massey, LLC — Compare-N-Save Concentrate Weed & Grass Killer 41% Glyphosate product label (EPA Reg. No. 84009-27)"
      url: "https://www3.epa.gov/pesticides/chem_search/ppls/084009-00027-20191007.pdf"
      publication_date: "2019-10-07"
    jurisdiction_range:
      flagged: false
      note: null
  - category: followup_secondary_invasion
    answer: >
      Monitoring the treated footprint alone is not enough, because Chinese privet's small dark fruits are
      dispersed by birds well beyond the original colony — a landowner who fully controls the privet in
      their own fence line can still get new seedlings from a bird-carried seed originating on a
      neighboring property or hedgerow, so the follow-up check needs to extend to field margins, fence
      lines, and disturbed ground nearby, not just the treated patch itself. Within the treated footprint,
      re-inspect throughout the current season and again the following growing season for resprouts from
      surviving root tissue, and treat them while they're still small rather than letting a resprout regrow
      to the size of the original plant.
    citation:
      source: "NC Cooperative Extension, Madison County Center — On the Lookout for Non-Native Invasive Plant Species: Chinese Privet"
      url: "https://madison.ces.ncsu.edu/news/on-the-lookout-for-non-native-invasive-plant-species-chinese-privet/"
      publication_date: "2026-04-29"
    jurisdiction_range:
      flagged: false
      note: null
  - category: disposal_nontarget_risk
    answer: >
      Privet fruit is toxic to humans and animals if eaten, so cut material carrying ripe or unripe berries
      should not be left where pets, livestock, or children can access it, and should not be left on-site
      at all if birds can still strip and disperse the berries before the material breaks down — bag and
      remove it rather than leaving a cut, fruiting branch in a brush pile. Because privet spreads readily
      into any disturbed or bare ground, avoid leaving the cleared area bare; the same soil disturbance
      that pulling or cutting larger plants causes is itself a risk factor for reinvasion (by privet or
      other opportunists) if the site isn't stabilized or replanted afterward. On the herbicide side,
      triclopyr's selectivity for woody plants makes it the lower-non-target-risk choice near desirable
      lawn or herbaceous groundcover, while glyphosate's non-selectivity means any desirable plant it
      contacts — including grass — will also be killed, so glyphosate foliar spray needs careful,
      drift-free application near anything worth keeping.
    citation:
      source: "NC Cooperative Extension, Madison County Center — On the Lookout for Non-Native Invasive Plant Species: Chinese Privet"
      url: "https://madison.ces.ncsu.edu/news/on-the-lookout-for-non-native-invasive-plant-species-chinese-privet/"
      publication_date: "2026-04-29"
    jurisdiction_range:
      flagged: false
      note: null
