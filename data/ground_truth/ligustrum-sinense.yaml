  - category: followup_secondary_invasion
    answer: >
      Monitoring the treated footprint alone is not enough: "Chinese privet also spreads over a
      wide area when seeds are dropped by birds after eating the fruits from this invasive
      plant," so new seedlings can originate from a bird-carried seed from a neighboring property
      or hedgerow, well outside the treated patch — the follow-up check needs to extend to field
      margins, fence lines, and disturbed ground nearby, not just the treated patch itself. Within
      the treated footprint, "Any treatments conducted to control Chinese privet should be closely
      monitored for regrowth throughout the year and through the next season of growth to ensure
      that the infestation is caught early and treated before it begins to come back."
    citation:
      source: "NC Cooperative Extension, Madison County Center — On the Lookout for Non-Native Invasive Plant Species: Chinese Privet"
      url: "https://madison.ces.ncsu.edu/news/on-the-lookout-for-non-native-invasive-plant-species-chinese-privet/"
      publication_date: "2026-04-29"
    jurisdiction_range:
      flagged: false
      note: null
  - category: disposal_nontarget_risk
    answer: >
      Chinese privet's fruit and foliage carry a direct human-health risk: "This plant is toxic to
      humans as well, both the fruits and leaves, and can cause symptoms like abdominal pain,
      nausea, vomiting, diarrhea, low blood pressure, headaches, and weakness and clammy skin that
      can last up to two or three days" — cut material carrying berries should not be left where
      pets, livestock, or children can reach it. On the herbicide side, the foliar-spray method
      "must be used with caution, as it can cause injury to more beneficial woody plants in the
      area if they are near the targeted invasive species," since triclopyr (used at "a 2 percent
      solution ... mixed with a 0.5 percent non-ionic surfactant") is selective for woody plants —
      making it the lower-risk choice near desirable turf or herbaceous groundcover, whereas a
      non-selective glyphosate foliar spray will kill any green plant it contacts, including
      grass, so it needs careful, drift-free application. Because "cutting or pulling larger sizes
      of this invasive species ... can even further the spread through the disturbing of the
      soil," avoid leaving a cleared area bare and unstabilized afterward, since bare disturbed
      ground is exactly what privet colonizes.
    citation:
      source: "NC Cooperative Extension, Madison County Center — On the Lookout for Non-Native Invasive Plant Species: Chinese Privet"
