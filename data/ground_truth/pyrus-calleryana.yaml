  - category: disposal_nontarget_risk
    answer: >
      Every herbicide-based removal method ends with a standing dead tree, which NC State flags as a
      hazard to plan for, not just address after the fact: "Note that all of the previous methods will
      ultimately leave a standing dead tree, which could be a hazard that may require removal." Cut
      material itself is also hazardous to handle: wild Callery pear's "thorns that can grow up to 4
      inches long... can injure livestock and wildlife," and are "even capable of popping tractor
      tires, posing a hazard to equipment and operators." On herbicide non-target risk, foliar spray
      carries the most: "nonselective herbicides may damage surrounding vegetation," whereas
      hack-and-squirt and cut-stump "minimize off-target impacts because there is limited contact by
      herbicides with nearby plants." Whichever method and product is used, "It is essential to follow
      all pesticide label instructions, as they are legally binding and enforceable by law."
