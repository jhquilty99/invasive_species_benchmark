species: "Pyrus calleryana"
common_name: "Callery / Bradford pear"
failure_archetype: "Rootstock resprouting after cut"
jurisdiction: "NC / southeastern coastal plain"

cells:
  - category: method_selection
    answer: >
      Method should match tree size and site. For an individual mature Callery/Bradford pear a
      landowner can safely fell, NC State recommends cutting the tree at the base and immediately
      applying a concentrated systemic herbicide (glyphosate or triclopyr) to the freshly cut stump —
      since only the vascular tissue near the stump's outer edge needs to be reached, treatment can be
      limited to the stump's circumference rather than flooding the whole cut face. Where felling
      isn't practical (a tree left standing, or a thicket of resprouts/seedlings too numerous to fell
      individually), the alternatives are foliar spraying of the leaves in mid-to-late summer,
      basal-bark application of an oil-soluble herbicide to the lower 12-18 inches of trunk during the
      dormant season, or hack-and-squirt (downward cuts spaced around the trunk, one per 3 inches of
      diameter, each filled with herbicide) — hack-and-squirt in particular limits herbicide contact to
      the treated tree, reducing risk to nearby desirable plants.
    citation:
      source: "NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive Offspring"
      url: "https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring"
      publication_date: "2025-07-10"
    jurisdiction_range:
      flagged: false
      note: null
  - category: resprout_regrowth
    answer: >
      Cut, storm-damaged, or otherwise injured Callery/Bradford pear reliably resprouts, and the
      reason is specific to how the ornamental cultivars are propagated: "Bradford" and the other
      named cultivars are clones, propagated by grafting cuttings onto wild-type Pyrus calleryana
      seedling rootstock. Per UGA Extension, damage to that grafted crown — including cutting the tree
      down — "can cause [the wild-type rootstock] to sprout and go on to produce fertile fruit." In
      practice, this means a landowner who simply cuts down a Bradford pear without treating the stump
      has not removed the invasive risk — they have traded a largely sterile ornamental tree for
      vigorous resprouts of the thorny, fertile, fully invasive wild-type form growing from the same
      rootstock.
    citation:
      source: "UGA Cooperative Extension — Dig Into DeKalb County: \"Bradford Pears – How Did They Get Here?\""
      url: "https://site.extension.uga.edu/dekalb/2024/03/bradford-pears-how-did-they-get-here/"
      publication_date: "2024-03-08"
    jurisdiction_range:
      flagged: false
      note: null
  - category: timing_windows
    answer: >
      Cut-stump treatment is the least seasonally restricted method, but it is the most time-sensitive
      within a single treatment: herbicide must be applied to the freshly cut stump within 5 to 10
      minutes of cutting, or the cut surface loses its ability to take up herbicide effectively.
      Foliar spraying works best mid-to-late summer, while the tree is actively growing and fully
      leafed out. Basal-bark treatment (painting an oil-soluble herbicide on the lower trunk) is best
      done during the dormant season, when there's no leaf canopy to interfere with penetration.
      Hack-and-squirt gives its best results in fall.
    citation:
      source: "NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive Offspring"
      url: "https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring"
      publication_date: "2025-07-10"
    jurisdiction_range:
      flagged: false
      note: null
  - category: herbicide_legality
    answer: >
      For cut-stump treatment on Callery pear, a North Carolina landowner without a pesticide
      applicator license can legally buy and apply ferti-lome Brush Killer • Stump Killer (8.8%
      triclopyr, as the triethylamine salt; EPA Reg. No. 62719-226-7401) — the label states "This
      Product Is For Outdoor Residential Use Only" and carries no Restricted Use Pesticide
      designation. Directions for stump treatment call for applying the product undiluted, straight
      from the container, with a paintbrush or backpack sprayer to completely cover the freshly cut
      stump surface. The same product doubles as a foliar spray for standing brush or resprouts at 8
      to 16 Tbsp (4 to 8 fl oz) per gallon of water — the label recommends the higher end of that range
      for mature or hard-to-control plants, since using too low a rate risks resprouting the following
      year. An unrestricted glyphosate concentrate (e.g., a 41% general-use lawn-and-garden product)
      applied the same way to a freshly cut stump is an equally legal alternative active ingredient.
    citation:
      source: "VPG / ferti-lome — Brush Killer • Stump Killer product label (EPA Reg. No. 62719-226-7401)"
      url: "https://www.fertilome.com/ProductFiles/2024/03/12/11485%20Brush%20Stump%20Killer%2032oz%20PO%20672_1123.pdf_FINAL%20copy%202%20label.pdf"
      publication_date: "2024-03-12"
    jurisdiction_range:
      flagged: false
      note: null
  - category: followup_secondary_invasion
    answer: >
      Cutting or herbiciding the parent tree is not the end of the job: Callery pear is "notorious for
      resprouting," and unless the root system is completely killed, follow-up herbicide treatment of
      any regrowth is required for complete eradication — so the treated site needs to be monitored
      regularly and re-treated if sprouts appear. Because open, disturbed ground (which removing a
      tree creates) is exactly the kind of site Callery pear colonizes from bird-dispersed seed, NC
      State recommends actively replacing a removed pear with a native flowering tree — flowering
      dogwood, eastern redbud, serviceberry, black cherry, or Chickasaw plum are the alternatives it
      names — rather than leaving the site open to reinvasion by rootstock resprouts or wind/bird-
      carried pear seed from elsewhere on the property or surrounding landscape.
    citation:
      source: "NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive Offspring"
      url: "https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring"
      publication_date: "2025-07-10"
    jurisdiction_range:
      flagged: false
      note: null
  - category: disposal_nontarget_risk
    answer: >
      Every herbicide-based removal method for Callery pear ends with a standing dead tree, which NC
      State flags as a hazard to plan for — limbs or the trunk eventually failing and falling — rather
      than something to address only after the fact; for a tree near a structure, driveway, or fence
      line, that argues for felling the tree as part of treatment rather than herbiciding it and
      leaving it standing. Non-target risk is highest with foliar spraying, since a nonselective
      herbicide applied to leaves can damage surrounding desirable vegetation through drift or direct
      contact; cut-stump and hack-and-squirt methods limit herbicide contact to the treated tree's own
      tissue and so carry substantially lower non-target risk. Whichever method and product is used,
      NC State is explicit that pesticide label instructions are "legally binding and enforceable by
      law," not merely advisory.
    citation:
      source: "NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive Offspring"
      url: "https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring"
      publication_date: "2025-07-10"
    jurisdiction_range:
      flagged: false
      note: null
