      note: null
  - category: timing_windows
    answer: >
      Cut-stump treatment carries a hard within-treatment deadline: per NC State Extension, "If
      herbicide is not applied within 5 to 10 minutes, it may not be able to penetrate, and the stump
      must be recut for the herbicide to be effective" — but the method itself is otherwise "suitable
      for year-round application," so long as "herbicide application should occur immediately after
      cutting for maximum effectiveness." Foliar spray is "best applied in mid- to late summer."
      Basal-bark treatment is "effective during dormant seasons; be sure to completely cover the
      trunk's circumference." Hack-and-squirt gives its "best results... when conducted in the fall."
    citation:
      source: "NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive Offspring"
      url: "https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring"
      publication_date: "2025-07-10"
    jurisdiction_range:
