      note: null
  - category: herbicide_legality
    answer: >
      For cut-stump treatment on Callery pear, a North Carolina landowner without a pesticide
      applicator license can legally buy and apply ferti-lome Brush Killer • Stump Killer (EPA Reg.
      No. 62719-226-7401; active ingredient "Triclopyr, triethylamine salt 8.8%"), labeled "For the
      control of unwanted woody plants, vines and broadleaf weeds around homes, cabins, fences,
      walkways, and other non-crop areas" — consumer retail language, not a restricted-use label. The
      stump-treatment directions: "To kill Stumps and prevent sprouting, apply the undiluted product
      with a paint brush or backpack sprayer to completely cover the freshly cut surface" — apply it
      promptly while the cut is still fresh, since a stump left to dry before treatment absorbs herbicide
      poorly. The same product doubles as a foliar spray
      for standing brush or resprouts: "mix 8 to 16 tablespoons (4 to 8 fl. oz.) in enough water to
      make one gallon mixed spray... Apply at the rate of one gallon mixed spray to approximately 500
      sq. ft. of area." A general-use glyphosate concentrate is a legal alternative active ingredient —
      Compare-N-Save's label directs users to "Cut the stump close to the soil surface," "Drive 4-5
      nail holes into the stump," and "Flood the stump with undiluted product." Neither product requires
      a license for a homeowner treating their own property; NCDA&CS's licensing page reserves that
      requirement for "commercial applicators applying any type of pesticide for compensation."
    citation:
      source: >
