  - category: followup_secondary_invasion
    answer: >
      Cutting or herbiciding the parent tree is not the end of the job: per NC State Extension,
      "Callery pear trees are notorious for resprouting; therefore, monitor treated areas regularly
      for signs of regrowth and reapply treatments if necessary." Reinvasion by seed is also a live
      risk on a newly opened site: "All varieties of Callery pear can produce viable seed. When birds
      and other animals eat the fruit and spread the seeds through their droppings, new invasive trees
      can grow elsewhere." NC State's stated response is active replacement: "Landowners with Callery
      pears on their property are encouraged to remove them and replace them with native trees to
      reduce continued spread and negative impacts... Examples include flowering dogwood (Benthamidia
      florida), eastern redbud (Cercis canadensis), serviceberry (Amelanchier spp.), black cherry
      (Prunus serotina), or Chickasaw plum (Prunus angustifolia)." NC State's own Bradford Pear Bounty
      Program news coverage adds the practical case for acting early: forestry specialist Kelly Oten
      notes "seedlings may emerge for several years, so continued monitoring and removal is key," and
      "It is much easier to pull up a seedling now than to cut down a large tree in a decade."
    citation:
      source: >
        NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their
        Invasive Offspring; Kelly Oten quotes per NC State College of Natural Resources News —
        Bradford Pear Bounty Program, https://cnr.ncsu.edu/news/2026/04/bradford-pear-bounty-program/
