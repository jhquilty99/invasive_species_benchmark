species: "Pyrus calleryana"
common_name: "Callery / Bradford pear"
failure_archetype: "Rootstock resprouting after cut"
jurisdiction: "NC / southeastern coastal plain"

cells:
  - category: method_selection
    answer: >
      NC State Extension: "It is strongly recommended to treat stumps with an appropriate herbicide
      (for example, glyphosate or triclopyr) after cutting to prevent resprouting." "The cut-stump
      method is highly preferred for larger specimens, as it removes the tree entirely; cut the tree
      at its base and immediately apply concentrated glyphosate or triclopyr directly to the freshly
      cut stump. For large trees, herbicide application can be limited to the stump's circumference,
      as it only needs to penetrate the vascular tissues to be effective." Where felling isn't
      practical, the alternatives are: foliar spray, where "glyphosate (for example, Roundup) and
      imazapyr consistently provide control"; basal bark, where "Triclopyr (for example, Forestry
      Garlon XRT) and triclopyr + aminopyralid (for example, Milestone) are effective as basal bark
      applications, when mixed with a basal oil"; or hack-and-squirt, which "involves making incisions
      (hacks) through the bark and then applying a measured dose of herbicide into each cut. Typically,
      one hack per 3 inches of trunk diameter is sufficient" — this method "minimizes off-target
      impacts because there is limited contact by herbicides with nearby plants."

      In residential settings, "removal typically involves cutting down the tree and grinding the stump
      to prevent regrowth," but because Callery pear "can resprout from the roots, applying a targeted
      herbicide to the freshly cut stump is often necessary for complete eradication." Because managing
      a mature, established tree can be hazardous, "in urban areas, landowners are encouraged to contact
      a Certified Tree Arborist to ensure safe and effective removal."
    citation:
      source: "NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive Offspring"
      url: "https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring"
      publication_date: "2025-07-10"
    jurisdiction_range:
      flagged: false
      note: null
  - category: resprout_regrowth
    answer: >
      Cut, storm-damaged, or otherwise injured Callery/Bradford pear reliably resprouts, and the
      reason is specific to how the ornamental cultivars are propagated. Per UGA Extension: "It
      continues to be propagated to this day by grafting cuttings onto the wild-type Pyrus calleryana
      rootstock, meaning all Bradford pears are clones. These clones were thought to be sterile but
      have earned an invasive status after spreading rapidly." Critically, "Damage to the wild-type
      rootstock can cause it to sprout and go on to produce fertile fruit." In practice, this means a
      landowner who simply cuts down a Bradford pear without treating the stump has not removed the
      invasive risk: "These hybridized wild Callery pear trees are thorny and create dense thickets
      that rapidly spread. They limit the amount of wildlife food, out-compete native plants, damage
      equipment and can injure animals and humans."

      NC State Extension's description of the tree adds the mechanical trigger behind that resprouting
      response: the tree's "weak branching structure and brittle wood result in frequent breakage," and
      "Mild or moderate storms cause excessive branch and main stem breakage, leaving a mess and, in the
      worst cases, property damage or personal injury." That same stress response drives new growth from
      below: Callery pear "can sprout new growth from its base; because these trees were developed by
      combining different rootstock, the sprouts can also cross-pollinate with the flowers on the upper
      branches" to produce viable seed. Those basal sprouts also carry "thorns that can grow up to 4
      inches long."
    citation:
      source: >
        UGA Cooperative Extension — Dig Into DeKalb County: "Bradford Pears – How Did They Get Here?", for
        the clonal-rootstock/grafting origin; storm-damage, sprout-from-base, and thorn-length quotes per
        NC State Extension Publications — Callery Pear: 'Bradford' and Other Varieties and Their Invasive
        Offspring, https://content.ces.ncsu.edu/callery-pear-bradford-pear-other-varieties-and-their-invasive-offspring
        (2025-07-10)
      url: "https://site.extension.uga.edu/dekalb/2024/03/bradford-pears-how-did-they-get-here/"
      publication_date: "2024-03-08"
    jurisdiction_range:
