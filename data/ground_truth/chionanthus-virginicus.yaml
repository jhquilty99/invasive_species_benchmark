species: "Chionanthus virginicus"
common_name: "Fringetree (American fringetree, white fringetree, grancy greybeard)"
failure_archetype: "Native lookalike for Chinese privet — mistaken-ID treatment removes a beneficial native tree"
jurisdiction: "NC / southeastern coastal plain"

cells:
  - category: method_selection
    answer: >
      The reliable way to tell fringetree apart from Chinese privet is leaf size and season of
      leaf retention, not growth form (both can appear as a multi-stemmed shrub-sized woody plant
      along a fence line or yard edge). Fringetree's leaves are "3-to-8-inch long, opposite,
      simple leaves," "wide, spear-shaped ... to 8\" long" — far larger than Chinese privet's
      "opposite, elliptic, small, thin leaves ... 1 to 2 inches long." Fringetree is also
      unambiguously "Deciduous," while Chinese privet in the NC coastal plain is an "evergreen or
      semi-evergreen shrub" that keeps most of its leaves through winter. No NC or federal
      extension source recommends any herbicide or removal treatment for fringetree — it is
      documented only as a "Native shrub often planted as a showy ornamental." The correct
      recommendation once fringetree is confirmed is to leave it in place; no treatment is
      warranted.
    citation:
      source: >
        NC State Extension Gardener Plant Toolbox — Chionanthus virginicus (Fringetree), for leaf
        size, deciduous habit, and ornamental status; leaf-size and evergreen/semi-evergreen
        comparison per NC State Extension Gardener Plant Toolbox — Ligustrum sinense (Chinese
