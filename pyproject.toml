[project]
name = "invasive-species-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hayden Quilty", email = "jhquilty99@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.3.0",
    "google-genai>=2.22.0",
    "langfuse>=4.15.1",
    "openai>=3.7.0",
    "openevals>=0.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harness"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-recording>=0.13.4",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["archive"]

[tool.mypy]
python_version = "3.11"
files = ["harness", "tests"]
exclude = "^archive/"
